<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
  <title data-i18n="debug.title">Storage API</title>
</head>

<body>
  <h1 data-i18n="debug.title">Storage API</h1>
  <button id="reload" data-i18n="debug.reload">Reload</button>
  <button id="preload" data-i18n="debug.preload">Preload</button>
  <button id="add-page" data-i18n="debug.addPage">Add Page</button>
  <button id="clear" data-i18n="debug.clear">Clear</button>
  <button id="notify" data-i18n="debug.notify">Show Notification</button>

  <form id="add" style="margin-top:1em">
    <label><span data-i18n="debug.key">Key:</span></label><input id="key">
    <label><span data-i18n="debug.value">Value:</span></label><input id="value">
    <input type="submit" value="Add" data-i18n-attr="value:debug.add">
  </form>

  <pre id="data"></pre>

  <script src="debug_script.js" type="module"></script>

</body>
</html>
