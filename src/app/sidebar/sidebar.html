<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
  <title data-i18n="app.title">Update Scanner</title>
  <link rel="stylesheet" href="chrome://browser/content/extension.css">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="jstree_theme/style.css">
</head>
<body>
  <div id="sidebar">
    <div id="tree"></div>
    <section id="preview" aria-live="polite">
      <div id="preview-title" data-i18n="sidebar.preview.title">
        Scan result
      </div>
      <div id="preview-empty" data-i18n="sidebar.preview.empty">
        Select a page to view the scan result.
      </div>
      <iframe
        id="preview-frame"
        class="preview-frame hidden"
        title="Scan result preview">
      </iframe>
    </section>
  </div>

  <dialog id="dialog-confirm">
    <form method="dialog">
      <p id="dialog-confirm-message"></p>
      <div class="dialog-buttons">
        <button class="browser-style default" type="submit" value="delete"
          data-i18n="sidebar.dialog.delete">
          Delete
        </button>
        <button class="browser-style" value="cancel"
          data-i18n="sidebar.dialog.cancel">
          Cancel
        </button>
      </div>
    </form>
  </dialog>

  <!-- Dependencies -->
  <script src="/dependencies/include/jquery/dist/jquery.min.js"></script>
  <script src="/dependencies/include/jstree/dist/jstree.min.js"></script>

  <script src="sidebar_script.js" type="module"></script>

</body>
</html>
